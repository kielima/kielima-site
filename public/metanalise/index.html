<head>

<script>
  try {
    var t = localStorage.getItem('kl-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<div class="shell meta-shell">

  <header class="meta-topbar">
    <a class="meta-back" href="/" data-i18n="navBack"></a>
    <div class="meta-actions">
      <button type="button" class="theme-toggle" id="theme-toggle">
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><line x1="12" y1="2.6" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="21.4"></line><line x1="2.6" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="21.4" y2="12"></line><line x1="5.6" y1="5.6" x2="7.3" y2="7.3"></line><line x1="16.7" y1="16.7" x2="18.4" y2="18.4"></line><line x1="5.6" y1="18.4" x2="7.3" y2="16.7"></line><line x1="16.7" y1="7.3" x2="18.4" y2="5.6"></line></svg>
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8z"></path></svg>
      </button>
      <select class="lang-select" id="lang-select" aria-label="Idioma / Language / 语言">
        <option value="PT">PT</option>
        <option value="EN">EN</option>
        <option value="ZH">中文</option>
      </select>
    </div>
  </header>

  <main>

    <section class="meta-hero">
      <span class="kicker" data-i18n="kicker"></span>
      <h1 data-i18n="title"></h1>
      <p class="home-lead" data-i18n="lead"></p>
      <span class="meta-updated">08.09.2026</span>
    </section>

    <section class="meta-section" aria-label="Indicadores">
      <div class="kpi-grid">
        <div class="kpi-tile">
          <span class="kpi-value" id="kpi-funil">—</span>
          <span class="kpi-label" data-i18n="kpiFunilLabel"></span>
        </div>
        <div class="kpi-tile">
          <span class="kpi-value" id="kpi-pares">—</span>
          <span class="kpi-label" data-i18n="kpiParesLabel"></span>
        </div>
        <div class="kpi-tile">
          <span class="kpi-value" id="kpi-vida">—</span>
          <span class="kpi-label" data-i18n="kpiVidaLabel"></span>
        </div>
        <div class="kpi-tile">
          <span class="kpi-value" id="kpi-releitura">—</span>
          <span class="kpi-label" data-i18n="kpiReleituraLabel"></span>
        </div>
      </div>
    </section>

    <section class="meta-section">
      <span class="section-label" data-i18n="tierLabel"></span>
      <h2 data-i18n="tierTitle"></h2>
      <p data-i18n="tierP"></p>
      <div class="tier-filter" id="tier-filter">
        <label class="tier-chip">
          <input type="checkbox" checked data-tier="p" id="tier-check-p">
          <span class="tier-swatch tier-swatch-p"></span>
          <span data-i18n="tierPrincipal"></span>
          <span class="tier-n" id="tier-n-p">—</span>
        </label>
        <label class="tier-chip">
          <input type="checkbox" checked data-tier="s" id="tier-check-s">
          <span class="tier-swatch tier-swatch-s"></span>
          <span data-i18n="tierSensibilidade"></span>
          <span class="tier-n" id="tier-n-s">—</span>
        </label>
      </div>
    </section>

    <section class="meta-section">
      <h2 data-i18n="progressTitle"></h2>
      <p data-i18n="progressP"></p>
      <div class="meta-card progress-wrap" id="progress-wrap">
        <svg class="progress-chart" id="progress-svg" role="img" aria-label="Gráfico de progresso"></svg>
        <div class="scatter-tooltip" id="progress-tooltip"></div>
      </div>
    </section>

    <section class="meta-section">
      <h2 data-i18n="scatterTitle"></h2>
      <p data-i18n="scatterP" id="scatter-desc"></p>
      <div class="meta-card scatter-wrap" id="scatter-wrap">
        <div class="scatter-layout">
          <svg class="scatter-chart" id="scatter-svg" role="img" aria-label="Gráfico de dispersão"></svg>
          <div class="cat-legend" id="cat-legend"></div>
        </div>
        <div class="scatter-tooltip" id="scatter-tooltip"></div>
      </div>
    </section>

    <section class="meta-section">
      <h2 data-i18n="forestTitle"></h2>
      <p data-i18n="forestP" id="forest-desc"></p>
      <div class="meta-card">
        <div class="forest-list" id="forest-list"></div>
      </div>
    </section>

    <section class="meta-section">
      <h2 data-i18n="unitChartTitle"></h2>
      <p data-i18n="unitChartP"></p>
      <div class="meta-card">
        <div class="unit-legend" id="unit-legend"></div>
        <div class="unit-chart-list" id="unit-chart-list"></div>
      </div>
    </section>

    <section class="meta-section">
      <span class="section-label" data-i18n="noteTitle"></span>
      <p class="meta-note" data-i18n="noteP"></p>
    </section>

  </main>

  <footer class="meta-footer">
    <span class="meta-cite" data-i18n="footerCite"></span>
    <a class="meta-copyright" href="/">kielima.com</a>
  </footer>

</div>

<script src="/assets/i18n.js"></script>
<script src="/assets/theme.js"></script>

</html>
