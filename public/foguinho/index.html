<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>foguinho</title>
  <meta name="description" content="Um toque simbólico pra dizer 'pensei em você' — sem mensagem, só o fogo aceso." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#f8f8f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d110e" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;1,400&family=Geist:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app" class="app">
    <p class="loading">carregando…</p>
  </main>

  <template id="tpl-onboarding">
    <div class="screen">
      <div class="flame-hero">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12.395 2.553a1 1 0 0 0-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.4 31.4 0 0 0-.613 3.58 2.64 2.64 0 0 1-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 0 0 5.05 6.05 6.981 6.981 0 0 0 3 11a7 7 0 1 0 11.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 0 1 7 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A3 3 0 0 1 12.12 15.12z" />
        </svg>
      </div>
      <p class="kicker" style="text-align: center">Foguinho</p>
      <h1>pensei em você</h1>
      <form id="form-name" class="stack">
        <label for="name">Como você quer aparecer pros seus amigos?</label>
        <input id="name" name="name" type="text" autocomplete="given-name" required maxlength="40" placeholder="seu nome" />
        <button type="submit">Começar</button>
      </form>
    </div>
  </template>

  <template id="tpl-home">
    <div class="screen">
      <header class="home-header">
        <div>
          <p class="kicker">Foguinho</p>
          <h1 class="home-title">
            <svg class="icon-flame" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12.395 2.553a1 1 0 0 0-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.4 31.4 0 0 0-.613 3.58 2.64 2.64 0 0 1-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 0 0 5.05 6.05 6.981 6.981 0 0 0 3 11a7 7 0 1 0 11.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 0 1 7 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A3 3 0 0 1 12.12 15.12z" />
            </svg>
            pensei em você
          </h1>
        </div>
        <button id="btn-invite" class="btn-ghost" type="button">+ convidar</button>
      </header>
      <hr class="rule" />

      <ul id="list-connections" class="connections"></ul>

      <p id="empty-state" class="empty" hidden>
        Ninguém por aqui ainda. Toque em <strong>+ convidar</strong> e mande o link
        pra alguém da sua rede de apoio — quando essa pessoa abrir, vocês já ficam conectados.
      </p>
    </div>
  </template>

  <template id="tpl-connection">
    <li class="connection">
      <button class="connection-name" type="button"></button>
      <span class="streak" hidden></span>
      <button class="btn-fire" type="button" aria-label="pensei em você">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12.395 2.553a1 1 0 0 0-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.4 31.4 0 0 0-.613 3.58 2.64 2.64 0 0 1-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 0 0 5.05 6.05 6.981 6.981 0 0 0 3 11a7 7 0 1 0 11.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 0 1 7 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A3 3 0 0 1 12.12 15.12z" />
        </svg>
      </button>
    </li>
  </template>

  <template id="tpl-invite">
    <div class="screen">
      <button class="btn-back" type="button">← voltar</button>
      <p class="kicker">Foguinho</p>
      <h1>Convidar alguém</h1>
      <p class="lead">Manda esse link pra pessoa. Quando ela abrir e entrar, vocês já podem trocar foguinhos — sem precisar de mais nada.</p>
      <div class="invite-link-box">
        <input id="invite-link" type="text" readonly />
        <button id="btn-copy" type="button">copiar</button>
      </div>
      <button id="btn-share" type="button" class="btn-primary" hidden>compartilhar</button>
    </div>
  </template>

  <template id="tpl-history">
    <div class="screen">
      <button class="btn-back" type="button">← voltar</button>
      <p class="kicker" id="history-kicker">Foguinho</p>
      <h1 id="history-name">—</h1>
      <div class="calendar">
        <div class="calendar-nav">
          <button id="cal-prev" class="btn-icon" type="button" aria-label="mês anterior">‹</button>
          <span id="cal-month" class="calendar-month">—</span>
          <button id="cal-next" class="btn-icon" type="button" aria-label="próximo mês">›</button>
        </div>
        <div class="calendar-weekdays">
          <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
        </div>
        <div id="cal-grid" class="calendar-grid"></div>
      </div>
    </div>
  </template>

  <template id="tpl-cal-day">
    <div class="cal-day">
      <span class="cal-day-number"></span>
      <svg class="cal-day-flame" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M12.395 2.553a1 1 0 0 0-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.4 31.4 0 0 0-.613 3.58 2.64 2.64 0 0 1-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 0 0 5.05 6.05 6.981 6.981 0 0 0 3 11a7 7 0 1 0 11.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 0 1 7 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A3 3 0 0 1 12.12 15.12z" />
      </svg>
    </div>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
