<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiê Lima — Papel semente</title>
<meta name="description" content="O cartão físico é impresso em papel semente: celulose reciclada, sem plástico e sem laminação, com sementes prensadas na própria folha. Como plantar.">
<meta name="theme-color" content="#f8f8f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d110e" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://kielima.com/cartao/papel-semente">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

<meta property="og:type" content="article">
<meta property="og:title" content="Plante este cartão.">
<meta property="og:description" content="Papel semente: celulose reciclada, sem plástico, com sementes prensadas na folha.">
<meta property="og:url" content="https://kielima.com/cartao/papel-semente">
<meta name="twitter:card" content="summary">

<!-- Mesmo tema escolhido no cartão -->
<script>
  try {
    var t = localStorage.getItem('kl-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/papel-semente.css">
</head>
<body>

<div class="shell seed-shell">

  <div class="garden garden--left" id="garden-left" aria-hidden="true"></div>
  <div class="garden garden--right" id="garden-right" aria-hidden="true"></div>

  <header class="seed-topbar">
    <a class="back-link" href="/cartao">← <span data-i18n="back"></span></a>
    <div class="topbar-actions">
      <button type="button" class="theme-toggle" id="theme-toggle">
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><line x1="12" y1="2.6" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="21.4"></line><line x1="2.6" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="21.4" y2="12"></line><line x1="5.6" y1="5.6" x2="7.3" y2="7.3"></line><line x1="16.7" y1="16.7" x2="18.4" y2="18.4"></line><line x1="5.6" y1="18.4" x2="7.3" y2="16.7"></line><line x1="16.7" y1="7.3" x2="18.4" y2="5.6"></line></svg>
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8z"></path></svg>
      </button>
      <select class="lang-select" id="lang-select" aria-label="Idioma / Language / 语言">
        <option value="PT">PT</option>
        <option value="EN">EN</option>
        <option value="ZH">中文</option>
      </select>
    </div>
  </header>

  <main>
    <div class="seed-intro">
      <h1 data-i18n="title"></h1>
      <p class="lead"><span class="lead-quip" data-i18n="closing"></span> <span data-i18n="lead"></span></p>
    </div>

    <div class="rule rule--seed"></div>

    <section class="seed-section seed-section--steps">
      <span class="section-label" data-i18n="stepsLabel"></span>
      <ol class="steps" id="steps"></ol>
    </section>

    <section class="seed-section seed-section--specs">
      <button type="button" class="specs-trigger" id="specs-trigger">
        <span data-i18n="specsLabel"></span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="14" y2="17"></line></svg>
      </button>
    </section>

    <div class="seed-outro">
      <a class="back-link" href="/cartao">← <span data-i18n="back"></span></a>
    </div>
  </main>

  <dialog class="specs-dialog" id="specs-dialog">
    <div class="specs-dialog-head">
      <span class="section-label" data-i18n="specsLabel"></span>
      <button type="button" class="specs-dialog-close" id="specs-dialog-close" aria-label="Fechar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
      </button>
    </div>
    <dl class="specs" id="specs"></dl>
  </dialog>

</div>

<script src="/assets/i18n.js"></script>
<script src="/assets/theme.js"></script>
<script src="/assets/papel-semente.js"></script>
</body>
</html>
