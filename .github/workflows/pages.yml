# Publica o conteúdo de public/ no GitHub Pages a cada push na main.
#
# A pasta public/ é mantida como está (em vez de mover os arquivos para a raiz
# do repositório) para que o wrangler.jsonc continue válido — assim o site pode
# voltar para o Cloudflare Workers sem reorganizar nada.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; pushes novos cancelam uma publicação em andamento.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Enviar o conteúdo de public/
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
